<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>B级闯关王</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh}
body{
  margin:0;background:radial-gradient(120% 90% at 50% 0%,#141a30 0%,#0b0e1a 70%);
  color:#f0f3ff;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  overflow:hidden;user-select:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  touch-action:manipulation;overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app{width:100%;max-width:540px;height:100%;margin:0 auto;position:relative;overflow:hidden;box-shadow:0 0 0 1px #232a4455,0 0 60px #000000aa}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px 14px 10px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  animation:fadein .22s ease}
.screen::-webkit-scrollbar{width:0}
.hidden{display:none!important}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 通用 ---------- */
.card{background:#1a2038;border-radius:18px;padding:14px 16px;margin-bottom:10px}
.btn{
  appearance:none;border:0;cursor:pointer;font-family:inherit;font-size:16px;font-weight:700;
  color:#eef1ff;background:linear-gradient(180deg,#38415f,#252b45);
  border-radius:14px;padding:16px 12px;box-shadow:0 4px 0 #14192b;transition:transform .06s,filter .15s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #14192b}
.btn:hover{filter:brightness(1.12)}
.btn.primary{background:linear-gradient(180deg,#37d68f,#1c9e64);color:#06281b;box-shadow:0 5px 0 #117a4c}
.btn.primary:active{box-shadow:0 1px 0 #117a4c}
.btn.big{font-size:20px;padding:22px 12px;border-radius:18px}
.btn.small{font-size:14px;padding:13px 6px}
.btn.cardbtn{background:linear-gradient(180deg,#2b3350,#1e243a);font-size:15px;padding:18px 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;margin-top:10px}
.row>*{flex:1}
.row3{display:flex;gap:10px;margin-top:10px}
.row3>*{flex:1}
.hint{text-align:center;color:#6e7696;font-size:11px;margin:10px 0 2px}
h1{font-size:27px;margin:8px 0 0;text-align:center;letter-spacing:.5px}
.sub{text-align:center;color:#8b93b5;font-size:11.5px;margin:2px 0 12px}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:10px;background:#171d33;border-radius:16px;padding:10px 12px}
.lv-badge{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;
  background:linear-gradient(135deg,#a573ff,#5aa5ff);color:#fff;flex:none;box-shadow:0 2px 8px #5aa5ff44}
.lv-info{flex:1;min-width:0}
.rank{font-size:12.5px;font-weight:700;margin-bottom:4px}
.xpbar{height:9px;border-radius:5px;background:#2c3455;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#ffd35c,#ffb020);transition:width .35s}
.xptext{font-size:9.5px;color:#6e7696;margin-top:3px}
.stats{display:flex;gap:8px;flex:none}
.stat{display:flex;flex-direction:column;align-items:center;min-width:32px}
.stat span{font-size:15px;line-height:1}
.stat b{font-size:11.5px;margin-top:2px;font-weight:700}

/* ---------- 首页 ---------- */
.overview{margin-top:12px}
.ov-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:#a8b0cc;margin-bottom:5px}
.ov-row b{font-size:13px}
.bigbar{height:12px;border-radius:6px;background:#2c3455;overflow:hidden;margin:2px 0 10px}
.bigbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#37d68f,#1c9e64);transition:width .4s}
.mini{display:flex;justify-content:space-between;font-size:11.5px;color:#6e7696;margin-top:4px}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 8px;font-size:13px;font-weight:700}
.sec-title small{font-weight:400;color:#6e7696;font-size:10px}
.quest{display:flex;align-items:center;gap:10px;background:#181e33;border-radius:12px;padding:9px 12px;margin-bottom:7px}
.quest.done{background:#1d3a2c}
.quest .qmain{flex:1;min-width:0}
.quest .qtext{font-size:12.5px;margin-bottom:5px}
.quest .qbar{height:7px;border-radius:4px;background:#2c3455;overflow:hidden;max-width:200px}
.quest .qbar i{display:block;height:100%;width:0;background:#37d68f}
.quest .qprog{font-size:10px;color:#6e7696;margin-top:3px}
.quest .qreward{font-size:11.5px;color:#6e7696;white-space:nowrap}
.quest.done .qreward{color:#ffd35c;font-weight:700}

/* ---------- 学习屏 ---------- */
.study-top{display:flex;align-items:center;gap:10px;padding:2px 0 10px}
.study-top .x{font-size:22px;color:#8b93b5;cursor:pointer;width:26px;flex:none}
.study-top .pbar{flex:1;height:14px;border-radius:7px;background:#28304e;overflow:hidden}
.study-top .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#37d68f,#3ee6a0);transition:width .3s}
.study-top .hp{font-size:14px;font-weight:700;color:#f05a64;flex:none}
.combo{text-align:center;color:#ffd35c;font-weight:800;font-size:13px;height:18px;margin-bottom:2px}
.qtype{text-align:center;color:#6e7696;font-size:11.5px;margin-bottom:10px}
.qcard{background:#1a2038;border-radius:20px;padding:20px 16px;text-align:center;min-height:180px;
  display:flex;flex-direction:column;justify-content:center;gap:6px}
.qword{font-size:34px;font-weight:800;letter-spacing:.5px;word-break:break-word}
.qipa{font-size:13px;color:#5aa5ff}
.qpos{font-size:11.5px;color:#6e7696}
.qcn{font-size:26px;font-weight:800;line-height:1.35}
.qex{margin-top:8px;font-size:12.5px;color:#a8b0cc;line-height:1.6}
.qex em{color:#37d68f;font-style:normal;font-weight:700}
.qex-cn{font-size:11px;color:#6e7696;margin-top:2px}
.speaker{width:76px;height:76px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:30px;
  background:linear-gradient(135deg,#3d8bff,#a573ff);cursor:pointer;box-shadow:0 4px 14px #3d8bff55;transition:transform .1s}
.speaker:active{transform:scale(.94)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{position:relative;background:#262d48;border:1.5px solid #343d60;border-radius:14px;padding:16px 10px;
  font-size:14.5px;font-weight:700;color:#f0f3ff;cursor:pointer;min-height:58px;display:grid;place-items:center;
  text-align:center;transition:background .12s,border-color .12s;box-shadow:0 3px 0 #161b2c;word-break:break-word}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 #161b2c}
.opt:hover{background:#2e3757}
.opt .num{position:absolute;top:5px;right:8px;font-size:10px;color:#5b6488;font-weight:700}
.opt.right{background:#1f6b4a;border-color:#37d68f}
.opt.wrongsel{background:#5b2029;border-color:#f05a64}
.opt.dim{opacity:.45}
.opt.key{background:#2e3757;border-color:#5aa5ff}
.spellwrap{margin-top:16px}
.spell{width:100%;padding:16px;font-size:20px;text-align:center;border-radius:14px;border:2px solid #343d60;
  background:#262d48;color:#fff;outline:none;font-family:inherit;letter-spacing:1px}
.spell:focus{border-color:#5aa5ff}
.fb{position:fixed;left:0;right:0;bottom:0;padding:12px 16px 16px;z-index:20;animation:fbup .18s ease;
  background:#12361f;border-top:1px solid #1d5e3c}
.fb.bad{background:#3a161c;border-top-color:#5e1d27}
@keyframes fbup{from{transform:translateY(100%)}to{transform:none}}
.fb .fbtitle{font-size:15px;font-weight:800;margin-bottom:6px}
.fb.good .fbtitle{color:#3ee6a0}
.fb.bad .fbtitle{color:#ff7b85}
.fb .fbword{font-size:13px;margin-bottom:4px}
.fb .fbex{font-size:11.5px;color:#a8b0cc;line-height:1.5}
.fb .fbcx{font-size:11px;color:#8b93b5;margin-top:2px}
.fb .fbxp{position:absolute;right:16px;top:12px;font-weight:800;font-size:13px;color:#ffd35c}
.fb .fbgo{text-align:center;font-size:11.5px;color:#8b93b5;margin-top:10px}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}
60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

/* ---------- 结算 ---------- */
.result-top{text-align:center;padding:14px 0 4px}
.bigstar{font-size:58px;line-height:1;filter:drop-shadow(0 4px 12px #ffd35c66);animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.result-title{font-size:23px;font-weight:800;margin:8px 0 16px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statbox{background:#1a2038;border-radius:16px;padding:14px;text-align:center}
.statbox .v{font-size:30px;font-weight:800;line-height:1.1}
.statbox .k{font-size:11.5px;color:#8b93b5;margin-top:4px}
.statbox.gold{background:linear-gradient(180deg,#3a3016,#241d10)}
.statbox.blue{background:linear-gradient(180deg,#17243d,#111a2c)}
.statbox.gold .v{color:#ffd35c}
.statbox.blue .v{color:#5aa5ff}
.statbox.green .v{color:#3ee6a0}
.msgline{text-align:center;font-size:12px;margin:14px 0 4px}
.msgline.good{color:#3ee6a0}
.msgline.bad{color:#ff7b85}

/* ---------- 数据屏 / 成就 / 计划 ---------- */
.screen-title{text-align:center;font-size:20px;font-weight:800;margin:6px 0 14px}
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{background:#181e33;border-radius:14px;padding:10px 6px;text-align:center;border:1.5px solid transparent}
.badge.got{background:#1d3a2c;border-color:#2f7a5a}
.badge .bico{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;
  font-size:14px;font-weight:800;background:#232a44;color:#6e7696}
.badge.got .bico{background:#2c5744;color:#ffd35c;box-shadow:0 0 0 2px #ffd35c inset}
.badge .bname{font-size:10.5px;font-weight:700;margin-bottom:3px}
.badge .bdesc{font-size:8.5px;color:#6e7696;line-height:1.35}
.badge:not(.got) .bname{color:#8b93b5}
.week{display:flex;justify-content:space-between;align-items:flex-end;height:110px;padding:8px 4px 0}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.wbar{width:22px;border-radius:5px;background:#2c3455;transition:height .3s;min-height:3px}
.wcol b{font-size:9px;color:#8b93b5;font-weight:400}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl td{padding:8px 6px;border-bottom:1px solid #232a44}
.tbl td:last-child{text-align:right;color:#3ee6a0;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.phase{background:#1a2038;border-radius:14px;padding:12px 14px;margin-bottom:9px;border-left:5px solid #37d68f}
.phase .pw{font-size:11px;color:#ffd35c;font-weight:700}
.phase .pt{font-size:13.5px;font-weight:800;margin:3px 0 6px}
.phase .pd{font-size:11px;color:#a8b0cc;line-height:1.6}
.phase .pd2{font-size:11px;color:#6e7696;line-height:1.6}

/* ---------- 移动端适配 ---------- */
@media (max-width:430px){
  h1{font-size:24px;margin-top:6px}
  .sub{font-size:11px;margin-bottom:10px}
  .topbar{padding:9px 10px;gap:8px}
  .lv-badge{width:38px;height:38px;font-size:16px}
  .btn{font-size:15px;padding:15px 10px}
  .btn.big{font-size:19px;padding:20px 10px}
  .btn.small{font-size:13px;padding:12px 4px}
  .opt{padding:14px 8px;font-size:13.5px;min-height:56px}
  .qword{font-size:30px}
  .qcn{font-size:23px}
  .qcard{padding:18px 14px;min-height:170px}
  .statbox .v{font-size:26px}
  .badge-grid{grid-template-columns:repeat(4,1fr);gap:8px}
  .badge{padding:8px 4px}
  .badge .bname{font-size:10px}
  .badge .bdesc{font-size:8px}
  .fb{padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
}
@media (max-height:640px){
  h1{font-size:22px;margin:2px 0 0}
  .sub{margin:0 0 8px}
  .qcard{min-height:140px;padding:14px}
  .qword{font-size:26px}
}
/* 移动端去掉 hover 高亮（否则点完一直亮） */
@media (hover:none){
  .btn:hover{filter:none}
  .opt:hover{background:#262d48}
}
input,textarea,select{font-size:16px}   /* 防止 iOS 自动放大 */

/* ---------- toast / 升级 ---------- */
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-140%);background:#2a3350;color:#fff;
  padding:11px 20px;border-radius:13px;font-size:13px;font-weight:700;z-index:50;transition:transform .28s;
  box-shadow:0 8px 24px #0008;max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
#levelup{position:fixed;inset:0;display:grid;place-items:center;z-index:60;pointer-events:none}
#levelup .lubox{background:linear-gradient(180deg,#1f5c46,#17462f);border:2px solid #ffd35c55;
  border-radius:22px;padding:24px 34px;text-align:center;box-shadow:0 20px 60px #000a;animation:pop .45s ease}
#levelup .lu1{font-size:30px;margin-bottom:6px}
#levelup .lu2{font-size:17px;font-weight:800;color:#ffd35c}
#levelup .lu3{font-size:12.5px;color:#a8b0cc;margin-top:6px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app">

  <!-- ================= 首页 ================= -->
  <section id="s-home" class="screen">
    <div class="topbar">
      <div class="lv-badge" id="lvN">1</div>
      <div class="lv-info">
        <div class="rank" id="rankName">新手学徒</div>
        <div class="xpbar"><i id="xpFill"></i></div>
        <div class="xptext" id="xpText">0 / 100</div>
      </div>
      <div class="stats">
        <div class="stat"><span>🔥</span><b id="streakN">0</b></div>
        <div class="stat"><span>❤️</span><b id="heartsN">5/5</b></div>
        <div class="stat"><span>💎</span><b id="gemsN">0</b></div>
      </div>
    </div>

    <h1>B 级闯关王</h1>
    <p class="sub">PRETCO-B 词汇成瘾训练器</p>

    <div class="card overview">
      <div class="ov-row"><span>已掌握词汇</span><b id="ovLearned" style="color:#3ee6a0">0 / 0</b></div>
      <div class="bigbar"><i id="ovFill"></i></div>
      <div class="mini"><span id="ovToday">今天已学 0 个新词</span><span id="ovXp" style="color:#ffd35c;font-weight:700">今日 0 经验</span></div>
      <div class="mini"><span id="ovDue">待复习 0 个</span><span id="ovMis" style="color:#ff7b85;font-weight:700">错题本 0 个</span></div>
    </div>

    <div class="sec-title">每日任务 <small>完成即自动发放</small></div>
    <div id="questList"></div>

    <button id="btnDiag" class="btn cardbtn" style="display:none;margin-bottom:10px">先做摸底测试（3分钟）</button>
    <button id="btnBuyHearts" class="btn cardbtn" style="display:none;margin-bottom:10px">宝石补满体力（12 💎）</button>
    <button id="btnStart" class="btn primary big">开始学习</button>
    <div class="row">
      <button id="btnQuick" class="btn">快速测验</button>
      <button id="btnMistakes" class="btn">错题重练</button>
    </div>
    <div class="row3">
      <button id="btnBadges" class="btn small">成就</button>
      <button id="btnPlan" class="btn small">计划</button>
      <button id="btnStats" class="btn small">数据</button>
    </div>
    <p class="hint">空格/回车 继续 · 1-6 快捷键 · Esc 返回</p>
  </section>

  <!-- ================= 学习屏 ================= -->
  <section id="s-study" class="screen hidden">
    <div class="study-top">
      <div class="x" id="studyExit">×</div>
      <div class="pbar"><i id="studyBar"></i></div>
      <div class="hp" id="studyHp">5 ❤</div>
    </div>
    <div class="combo" id="comboLine"></div>
    <div class="qtype" id="qType"></div>
    <div class="qcard" id="qCard"></div>
    <div id="qBody"></div>
    <button class="btn primary big" id="btnNext" style="display:none;margin-top:14px">继续</button>
    <div style="flex:1"></div>
    <p class="hint" id="studyHint"></p>
  </section>

  <!-- ================= 结算 ================= -->
  <section id="s-result" class="screen hidden">
    <div class="result-top"><div class="bigstar">⭐</div></div>
    <div class="result-title" id="resTitle">本轮完成！</div>
    <div id="resBody"></div>
    <div style="flex:1"></div>
    <button class="btn primary big" id="btnResultDone">完成</button>
  </section>

  <!-- ================= 数据 ================= -->
  <section id="s-stats" class="screen hidden">
    <div class="screen-title">我的数据</div>
    <div id="statsBody"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="btnExport">导出存档</button>
      <button class="btn" id="btnImport">导入存档</button>
    </div>
    <div style="flex:1"></div>
    <div class="row3">
      <button class="btn" id="btnStatsBack">返回</button>
      <button class="btn" id="btnReset" style="color:#ff7b85">清空进度</button>
    </div>
    <input type="file" id="fileImport" accept=".json" style="display:none">
  </section>

  <!-- ================= 成就 ================= -->
  <section id="s-badges" class="screen hidden">
    <div class="screen-title">成就墙</div>
    <div id="badgeSub" style="text-align:center;color:#6e7696;font-size:12px;margin-bottom:14px"></div>
    <div class="badge-grid" id="badgeGrid"></div>
    <div style="flex:1"></div>
    <button class="btn" id="btnBadgeBack" style="margin-top:16px">返回</button>
  </section>

  <!-- ================= 计划 ================= -->
  <section id="s-plan" class="screen hidden">
    <div class="screen-title">我的作战计划</div>
    <div style="text-align:center;color:#ffd35c;font-size:12px;margin-bottom:14px">目标：PRETCO-B · 时长：约 8 周</div>
    <div id="planBody"></div>
    <div style="flex:1"></div>
    <button class="btn" id="btnPlanBack" style="margin-top:16px">返回</button>
  </section>
</div>

<div id="toast"></div>
<div id="levelup" class="hidden"><div class="lubox">
  <div class="lu1">🎉</div><div class="lu2" id="luTitle"></div><div class="lu3">新头衔已解锁</div>
</div></div>

<script>
/* ============================================================

/* ---------- 解码词库 ---------- */
function decodeWords(){
  const bin = atob(WORDS_B64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const text = new TextDecoder('utf-8').decode(bytes);
  const out = [];
  const seen = new Set();
  for (const line of text.split('\n')){
    const s = line.replace(/\r$/,'').trim();
    if (!s) continue;
    const f = s.split('\t');
    if (f.length < 4) continue;
    const w = f[0].toLowerCase();
    if (seen.has(w)) continue;
    seen.add(w);
    out.push({ w:w, ipa:f[1]||'', pos:f[2]||'', cn:f[3]||'', en:f[4]||'', cx:f[5]||'' });
  }
  return out;
}

function levelProgress(xp){
  let lv=1, need=100;
  while (xp>=need && lv<200){ xp-=need; lv++; need = 100 + (lv-1)*20; }
  return { lv, cur:xp, need };
}

/* C# 版存档 -> 网页版存档 */
function migrateSave(raw){
  const s = freshState();
  if (!raw) return s;
  s.xp = raw.Xp|0; s.gems = raw.Gems|0;
  s.hearts = raw.Hearts|0; s.streak = raw.Streak|0; s.bestStreak = raw.BestStreak|0;
  s.lastDay = raw.LastDay || '';
  s.placed = !!raw.Placed; s.placedLevel = raw.PlacedLevel|0;
  s.unlocked = Math.min(WORDS.length, Math.max(30, raw.UnlockedIndex|0));
  s.totalMs = raw.TotalMs|0; s.totalRight = raw.TotalRight|0; s.totalWrong = raw.TotalWrong|0;
  s.sessions = raw.Sessions|0;
  s.todayXp = raw.TodayXp|0; s.todayRight = raw.TodayRight|0; s.todayNew = raw.TodayNew|0;
  s.todaySessions = raw.TodaySessions|0;
  s.perfect = raw.PerfectSessions|0; s.maxCombo = raw.MaxCombo|0;
  s.heartTs = raw.HeartTicks ? TICKS_TO_MS(raw.HeartTicks) : nowMs();
  if (raw.Words){
    for (const k in raw.Words){
      const o = raw.Words[k];
      if (!WMAP.has(k)) continue;
      s.words[k] = {
        box:o.Box|0, right:o.Right|0, wrong:o.Wrong|0,
        due:o.DueTicks ? TICKS_TO_MS(o.DueTicks) : 0,
        learn:o.LearnTicks ? TICKS_TO_MS(o.LearnTicks) : 0
      };
    }
  }
  if (Array.isArray(raw.Mistakes)) s.mistakes = raw.Mistakes.filter(w => WMAP.has(w));
  if (Array.isArray(raw.Last7Xp)) s.last7 = raw.Last7Xp.slice(0,7).map(n=>n|0);
  if (Array.isArray(raw.Quests) && raw.Quests.length){
    s.quests = raw.Quests.map(q => ({ key:q.Key, text:q.Text, target:q.Target|0, done:q.Done|0, gems:q.Gems|0, claimed:!!q.Claimed }));
  }
  if (Array.isArray(raw.Badges) && raw.Badges.length){
    const got = new Set(raw.Badges.filter(b=>b.Got).map(b=>b.Id));
    s.badges = ICON_BADGES.map(([id,ico,name,desc]) => ({ id, ico, name, desc, got: got.has(id) }));
  }
  return s;
}

function loadState(){
  let s = null;

    // 没有网页存档：尝试用桌面版存档种子迁移
    s = migrateSave(SEED_SAVE);
  }
  // 补全结构
  const base = freshState();
  for (const k in base) if (s[k] === undefined) s[k] = base[k];
  if (!s.badges || !s.badges.length) s.badges = makeBadges();
  if (!Array.isArray(s.mistakes)) s.mistakes = [];
  if (!Array.isArray(s.last7)) s.last7 = [];

  S = s;

}

/* 每日滚动：跨天结算连胜、重置今日数据、刷新任务 */
function rollDay(silent){
  const today = todayStr();
  if (S.lastDay === today){ if (!S.quests || !S.quests.length) S.quests = makeQuests(); return; }
  if (S.lastDay){
    const last = new Date(S.lastDay + 'T00:00:00');
    const now = new Date(today + 'T00:00:00');
    const gap = Math.round((now - last)/DAY);
    if (gap === 1 && S.todayXp < 20) S.streak = 0;
    else if (gap > 1) S.streak = 0;
    if (gap >= 1 && S.todayXp > 0) S.last7.unshift(S.todayXp);
    while (S.last7.length > 7) S.last7.pop();
  }
  S.lastDay = today;
  S.todayXp = 0; S.todayRight = 0; S.todayNew = 0; S.todaySessions = 0;
  S.quests = makeQuests();
  if (!silent) save();
}

function regenHearts(silent){
  if (S.hearts >= MAX_HEARTS){ S.heartTs = nowMs(); return; }
  if (!S.heartTs) S.heartTs = nowMs();
  const mins = (nowMs() - S.heartTs)/60000;
  const gain = Math.floor(mins/HEART_MIN);
  if (gain > 0){
    S.hearts = Math.min(MAX_HEARTS, S.hearts+gain);
    S.heartTs += gain*HEART_MIN*60000;
    if (S.hearts >= MAX_HEARTS) S.heartTs = nowMs();
    if (!silent){ save(); toast('体力恢复 +'+gain+' ❤️'); }
  }
}
function nextHeartSec(){
  if (S.hearts >= MAX_HEARTS) return 0;
  const mins = (nowMs() - S.heartTs)/60000;
  return (HEART_MIN - (mins % HEART_MIN))*60;
}
function loseHeart(){
  if (S.hearts >= MAX_HEARTS) S.heartTs = nowMs();
  S.hearts = Math.max(0, S.hearts-1);
}
function buyHearts(){
  if (S.hearts >= MAX_HEARTS) return false;
  if (S.gems < HEART_COST) return false;
  S.gems -= HEART_COST; S.hearts = MAX_HEARTS; S.heartTs = nowMs(); save(); return true;
}

   出题引擎（与桌面版同一套间隔重复逻辑）
   ============================================================ */
let SES = null;   // 当前会话

function buildSession(mode, n){
  const now = nowMs();
  const due = [], fresh = [];
  for (let i=0;i<WORDS.length;i++){
    const w = WORDS[i], s = S.words[w.w];
    if (s && s.learn>0){ if (s.due <= now) due.push(w.w); }
    else if (i < S.unlocked) fresh.push(w.w);
  }
  due.sort((a,b)=>{
    const sa=S.words[a], sb=S.words[b];
    if (sa.box!==sb.box) return sa.box-sb.box;
    return sa.due-sb.due;
  });
  let dueList = due.slice(0, 12);
  const wantNew = n || 10;
  const newList = fresh.slice(0, wantNew);

  let queue = [];
  let di=0, fi=0;
  while (di<dueList.length || fi<newList.length){
    for (let k=0;k<3 && di<dueList.length;k++) queue.push(dueList[di++]);
    if (fi<newList.length) queue.push(newList[fi++]);
  }
  // 不足 12 题就用后面的新词补
  let idx = S.unlocked;
  while (queue.length < 12 && idx < WORDS.length){
    const w = WORDS[idx].w;
    if (!queue.includes(w)) queue.push(w);
    idx++;
  }
  if (mode === 'quick') queue = queue.slice(0, n || 10);
  return queue;
}

function startSession(mode){
  rollDay(); regenHearts();
  if (mode !== 'diag' && S.hearts <= 0){ toast('体力用完了，用宝石补或等 20 分钟'); return; }
  let queue;
  if (mode === 'diag'){ queue = buildDiag(); }
  else if (mode === 'mistakes'){
    const m = S.mistakes.slice();
    if (!m.length){ toast('错题本是空的，先学习吧'); return; }
    queue = m.slice(-20).reverse();
  }
  else queue = buildSession(mode, mode==='quick'?10:10);

  if (!queue.length){ toast('没有可学的词了，明天再来复习'); return; }
  SES = {
    mode, queue, idx:0, right:0, wrong:0, newWords:0, combo:0, maxCombo:0,
    xp:0, gems:0, start:nowMs(), answered:false, wasRight:false, cur:null,
    qtype:0, opts:[], ansIdx:-1, typed:'', qStart:0, diagRight:0, diagDone:0
  };
  nextQuestion();
  show('study');
  if (SES.qtype===2) speakWord(SES.cur.w);
}

function buildDiag(){
  const span = Math.min(1500, WORDS.length), n = Math.min(30, span);
  const q = [];
  for (let i=0;i<n;i++){
    const p = n===1 ? 0 : Math.round(i*(span-1)/(n-1));
    q.push(WORDS[p].w);
  }
  return q;
}

function distractors(word, num){
  const res = [];
  const passes = [3, 0, 99];  // 3: 同词性+长度接近；0: 同词性；99: 不限
  for (const pd of passes){
    let guard = 0;
    while (res.length < num && guard < 4000){
      guard++;
      const c = WORDS[rnd(WORDS.length)];
      if (c.w === word.w) continue;
      if (res.includes(c)) continue;
      if (pd===3){ if (c.pos!==word.pos) continue; if (Math.abs(c.w.length-word.w.length)>3) continue; }
      else if (pd===0){ if (c.pos!==word.pos) continue; }
      else { if (Math.abs(c.w.length-word.w.length)>4) continue; }
      res.push(c);
    }
  }
  while (res.length < num) res.push(WORDS[rnd(WORDS.length)]);
  return res;
}

function nextQuestion(){
  const s = SES;
  if (s.idx >= s.queue.length){ finishSession(); return; }
  const word = WMAP.get(s.queue[s.idx]);
  if (!word){ s.idx++; nextQuestion(); return; }
  s.cur = word;
  s.answered = false; s.wasRight = false; s.typed = ''; s.qStart = nowMs();
  const wstate = S.words[word.w];
  const isNew = !wstate || !(wstate.learn>0);
  const r = rnd(100);
  let t;
  if (s.mode==='diag') t = (r<55) ? 0 : 1;
  else if (isNew) t = (r<70) ? 0 : 1;
  else if (wstate.wrong > wstate.right) t = (r<45) ? 0 : (r<75 ? 1 : 3);
  else t = (r<32) ? 0 : (r<55 ? 1 : (r<80 ? 2 : 3));
  if (word.w.length <= 4) t = (r<60) ? 0 : 1;
  s.qtype = t;

  const pool = distractors(word, 12);
  if (t===0 || t===2){
    const opts = [word.cn];
    for (const d of pool){ if (opts.length>=4) break; if (d.cn===word.cn || opts.includes(d.cn)) continue; opts.push(d.cn); }
    while (opts.length<4) opts.push('以上都不是');
    shuffle(opts);
    s.opts = opts; s.ansIdx = opts.indexOf(word.cn);
  } else if (t===1){
    const opts = [word.w];
    for (const d of pool){ if (opts.length>=4) break; if (opts.includes(d.w)) continue; opts.push(d.w); }
    while (opts.length<4) opts.push('word');
    shuffle(opts);
    s.opts = opts; s.ansIdx = opts.indexOf(word.w);
  } else {
    s.opts = []; s.ansIdx = -1;
  }
  if ((t===0||t===1) && s.ansIdx < 0){
    s.opts[0] = (t===0?word.cn:word.w); s.ansIdx = 0;
  }
  renderStudy();
}

function shuffle(a){
  for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; }
}

function checkSpelling(typed, answer){
  const a = (typed||'').trim().toLowerCase().replace(/\s+/g,'_');
  const b = answer.trim().toLowerCase();
  if (a === b) return true;
  if (Math.abs(a.length-b.length) > 1) return false;
  if (b.length < 5) return false;
  let i=0,j=0,diff=0;
  while (i<a.length && j<b.length){
    if (a[i]===b[j]){ i++; j++; continue; }
    diff++;
    if (diff>1) return false;
    if (a.length>b.length) i++;
    else if (b.length>a.length) j++;
    else { i++; j++; }
  }
  diff += (a.length-i)+(b.length-j);
  return diff<=1;
}

function grade(right){
  const s = SES;
  if (s.answered) return;
  s.answered = true; s.wasRight = right;
  const word = s.cur;
  const ws = st(word.w);
  const wasNew = !(ws.learn>0);
  const secs = (nowMs()-s.qStart)/1000;

  if (right){
    s.right++; S.totalRight++; S.todayRight++;
    s.combo++; if (s.combo>s.maxCombo) s.maxCombo = s.combo;
    if (s.combo > S.maxCombo) S.maxCombo = s.combo;
    questProgress('right', 1);
    ws.box = Math.min(7, ws.box + 1);
    ws.right++;
    if (wasNew){
      ws.learn = nowMs();
      s.newWords++; S.todayNew++; S.todayNew = S.todayNew;
      questProgress('new', 1);
      if (S.unlocked < WORDS.length) S.unlocked++;
    }
    let pts = 10;
    if (secs < 2) pts += 2;
    if (secs > 12) pts -= 3;
    const mult = Math.min(3, 1 + Math.floor(s.combo/5));
    pts = Math.max(4, pts * mult);
    s.xp += pts; s.gems += 1;
    const days = BOX_DAYS[ws.box] || 1;
    ws.due = nowMs() + days*DAY - secs*1000;
    if (ws.right >= 2){
      const i = S.mistakes.indexOf(word.w);
      if (i >= 0) S.mistakes.splice(i,1);
    }
    beep('good');
    if (s.combo >= 3) speakNum(s.combo);
  } else {
    s.wrong++; S.totalWrong++; s.combo = 0;
    ws.wrong++; ws.box = 0;
    ws.due = nowMs() + 10*60000;
    if (!S.mistakes.includes(word.w)) S.mistakes.push(word.w);
    loseHeart();
    beep('bad');
    $('#qCard').classList.add('shake');
    setTimeout(()=>$('#qCard').classList.remove('shake'), 340);
  }
  save();
  renderStudy(false);
  renderFeedback();
}

function advance(){
  const s = SES;
  if (!s || !s.answered) return;
  if (s.mode === 'diag'){
    if (s.wasRight) s.diagRight++;
    s.diagDone++;
    if (s.diagDone >= 30 || s.idx+1 >= s.queue.length){
      finishDiag(); return;
    }
  }
  s.idx++;
  if (s.idx >= s.queue.length){ finishSession(); return; }
  nextQuestion();
  if (s.qtype===2) speakWord(s.cur.w);
}

function finishDiag(){
  removeFeedback();
  const rate = SES.diagDone ? SES.diagRight/SES.diagDone : 0;
  const span = Math.min(1500, WORDS.length);
  const est = Math.round(rate*0.8*span/50)*50;
  S.placed = true; S.placedLevel = est;
  unlockBadges(); save();
  SES = null;
  renderResultDiag(est, span);
  show('result');
}

function finishSession(){
  removeFeedback();
  const s = SES;
  const mins = (nowMs()-s.start)/60000;
  S.totalMs += mins*60000;
  S.sessions++; S.todaySessions++;
  if (s.wrong===0 && s.right>=8) S.perfect++;
  if (s.xp>0){
    addXp(s.xp); S.gems += s.gems;
  }
  // 连胜：当天累计经验达标
  if (S.todayXp >= 20){
    const today = todayStr();
    if (S.lastStreakCounted !== today){
      S.streak++; S.lastStreakCounted = today;
      if (S.streak > S.bestStreak) S.bestStreak = S.streak;
    }
  }
  claimQuests();
  unlockBadges();
  save();
  const snap = { right:s.right, wrong:s.wrong, xp:s.xp, gems:s.gems, newWords:s.newWords,
                 maxCombo:s.maxCombo, ms:nowMs()-s.start };
  SES = null;
  renderResultNormal(snap);
  show('result');
  confetti(snap.wrong===0 ? 90 : 45);
  if (pendingLevelUp){
    const lv = pendingLevelUp; pendingLevelUp = 0;
    showLevelUp(lv);
  }
}

function esc(s){ return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hl(en, word){
  const e = esc(en);
  const key = word.replace(/_/g,' ');
  const low = e.toLowerCase();
  let p = low.indexOf(key.toLowerCase());
  if (p < 0){ const k = word.toLowerCase(); p = low.indexOf(k); if (p>=0) return e.slice(0,p) + '<em>' + e.slice(p,p+k.length) + '</em>' + e.slice(p+k.length); return e; }
  return e.slice(0,p) + '<em>' + e.slice(p,p+key.length) + '</em>' + e.slice(p+key.length);
}

function answer(i){
  const s = SES;
  if (!s || s.answered || s.qtype===3) return;
  if (i < 0 || i >= s.opts.length) return;
  grade(i === s.ansIdx);
}

function submitSpelling(){
  const s = SES;
  if (!s || s.answered || s.qtype!==3) return;

/* ============================================================
   声音 & 语音（浏览器原生，无需外部文件）
   ============================================================ */
let AC = null;
function actx(){
  if (!AC){ try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  return AC;
}
function beep(kind){
  const ac = actx(); if (!ac) return;
  try {
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    const t = ac.currentTime;
    if (kind === 'good'){ o.type='sine'; o.frequency.setValueAtTime(1046,t); o.frequency.setValueAtTime(1568,t+0.06); }
    else if (kind === 'bad'){ o.type='square'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(140,t+0.16); }
    else { o.type='sine'; o.frequency.setValueAtTime(880,t); }
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(kind==='bad'?0.12:0.16, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(kind==='bad'?0.22:0.14));
    o.start(t); o.stop(t+0.25);
  } catch(e){}
}

let VOICE = null;
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices() || [];
    if (!vs.length) return null;
    VOICE = vs.find(v => /en-GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch(e){ VOICE = null; }
  return VOICE;
}
if ('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = () => pickVoice();
  pickVoice();
}
function say(text, rate){
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate || 0.9; u.pitch = 1;
    if (!VOICE) pickVoice();
    if (VOICE) u.voice = VOICE;
    speechSynthesis.speak(u);
  } catch(e){}
}
function speakWord(w){ say(String(w).replace(/_/g,' '), 0.85); }
function speakNum(n){ say(String(n), 0.95); }

/* ---------- 彩带 ---------- */
const cv = document.getElementById('fx');
const cx2d = cv.getContext('2d');
let parts = [], rafOn = false;
function resizeFx(){ cv.width = innerWidth; cv.height = innerHeight; }
resizeFx(); addEventListener('resize', resizeFx);
function confetti(n){
  const colors = ['#ffd35c','#37d68f','#5aa5ff','#a573ff','#ff7b85'];
  for (let i=0;i<n;i++){
    parts.push({
      x: Math.random()*cv.width, y: -20 - Math.random()*260,
      vx: (Math.random()*2-1)*1.2, vy: 1.6+Math.random()*3.2,
      r: 3+Math.random()*5, c: colors[rnd(colors.length)], life: 1+Math.random()
    });
  }
  if (!rafOn){ rafOn = true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  cx2d.clearRect(0,0,cv.width,cv.height);
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.x += p.vx*1.6; p.y += p.vy*1.6; p.vy += 0.055; p.life -= 0.006;
    if (p.life<=0 || p.y>cv.height+40){ parts.splice(i,1); continue; }
    cx2d.globalAlpha = Math.max(0, Math.min(1, p.life));
    cx2d.fillStyle = p.c;
    cx2d.beginPath(); cx2d.arc(p.x,p.y,p.r,0,Math.PI*2); cx2d.fill();
  }
  cx2d.globalAlpha = 1;
  if (parts.length){ requestAnimationFrame(fxLoop); }
  else { rafOn = false; cx2d.clearRect(0,0,cv.width,cv.height); }
}

/* ============================================================
   事件绑定
   ============================================================ */
function bind(){
  $('#btnStart').onclick = () => startSession('learn');
  $('#btnQuick').onclick = () => startSession('quick');
  $('#btnMistakes').onclick = () => startSession('mistakes');
  $('#btnDiag').onclick = () => startSession('diag');
  $('#btnBadges').onclick = () => show('badges');
  $('#btnPlan').onclick = () => show('plan');
  $('#btnStats').onclick = () => show('stats');
  $('#btnBuyHearts').onclick = () => {
    if (buyHearts()){ toast('体力已补满'); renderHome(); }
    else toast('宝石不够（需要 ' + HEART_COST + ' 💎）');
  };
  $('#studyExit').onclick = () => { save(); SES = null; removeFeedback(); show('home'); };
  $('#btnNext').onclick = () => advance();
  $('#btnResultDone').onclick = () => { show('home'); };
  $('#btnBadgeBack').onclick = () => show('home');
  $('#btnPlanBack').onclick = () => show('home');
  $('#btnStatsBack').onclick = () => show('home');
  $('#btnReset').onclick = () => {
    if (confirm('确定清空全部进度？不可恢复。')){
      window.__noSave = true;
      try { localStorage.removeItem(LS_KEY); } catch(e){}
      setTimeout(()=>location.reload(), 30);
    }
  };
  $('#btnExport').onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'blevel-save-' + todayStr() + '.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    toast('存档已导出');
  };
  $('#btnImport').onclick = () => $('#fileImport').click();
  $('#fileImport').onchange = ev => {
    const f = ev.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const obj = JSON.parse(rd.result);
        S = obj;
        const base = freshState();
        for (const k in base) if (S[k] === undefined) S[k] = base[k];
        save(); renderHome(); toast('存档已导入');
      } catch(e){ toast('存档文件无法解析'); }
    };
    rd.readAsText(f);
  };

  document.addEventListener('keydown', ev => {
    const inStudy = !$('#s-study').classList.contains('hidden');
    const inResult = !$('#s-result').classList.contains('hidden');
    const typing = document.activeElement && document.activeElement.id === 'spell';

    if (typing){
      if (ev.key === 'Enter'){ ev.preventDefault(); submitSpelling(); }
      if (ev.key === 'Escape'){ document.activeElement.blur(); }
      return;
    }
    if (inStudy){
      if (ev.key === 'Escape'){ save(); SES = null; removeFeedback(); show('home'); return; }
      if (ev.key === 'l' || ev.key === 'L'){ if (SES && SES.cur) speakWord(SES.cur.w); return; }
      if (['1','2','3','4'].includes(ev.key)){
        const i = parseInt(ev.key)-1;
        if (SES && !SES.answered && SES.qtype!==3) answer(i);
        return;
      }
      if (ev.key === ' ' || ev.key === 'Enter'){
        ev.preventDefault();
        if (SES && SES.answered) advance();
        return;
      }
      return;
    }
    if (inResult){ if (ev.key === ' ' || ev.key === 'Enter'){ show('home'); } return; }
    // 首页 / 其他屏
    if (ev.key === '1'){ startSession('learn'); return; }
    if (ev.key === '2'){ startSession('quick'); return; }
    if (ev.key === '3'){ startSession('mistakes'); return; }
    if (ev.key === '4'){ show('badges'); return; }
    if (ev.key === '5'){ show('plan'); return; }
    if (ev.key === '6'){ show('stats'); return; }
    if (ev.key === '0'){ startSession('diag'); return; }
    if (ev.key === 'Escape'){ show('home'); return; }
  });
}

  if (!S) return;
  const before = S.hearts;
  regenHearts(true);
  if (S.hearts !== before) renderHome();

      hn.textContent = S.hearts + '/' + MAX_HEARTS + ' ' + Math.ceil(left/60) + 'm';

    const bh = $('#btnBuyHearts');
    if (bh && S.placed) bh.style.display = 'none';
  }
}, 3000);
